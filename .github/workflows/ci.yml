name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    env:
      CI_SUMMARY_DIR: ${{ github.workspace }}/.ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: web-install
        run: bash scripts/ci/step.sh web-install

      - name: web-lint
        run: bash scripts/ci/step.sh web-lint

      - name: web-build
        run: bash scripts/ci/step.sh web-build

      - name: Upload CI failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-web
          path: .ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  api:
    name: API (fmt + clippy + build + test)
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      YOHAKU_TABLE: yohaku-ci
      DYNAMODB_PORT: "8000"
      CI_SUMMARY_DIR: ${{ github.workspace }}/.ci
      DYNAMODB_LOG: ${{ github.workspace }}/.ci/dynamodb-server.log
      DYNAMODB_PID_FILE: ${{ github.workspace }}/.ci/dynamodb.pid
    steps:
      - uses: actions/checkout@v4

      # Match rust-toolchain.toml (1.94.1 + rustfmt/clippy); toolchain input is required
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: dynamodb
        run: bash scripts/ci/step.sh dynamodb

      - name: api-fmt
        run: bash scripts/ci/step.sh api-fmt

      - name: api-clippy
        run: bash scripts/ci/step.sh api-clippy

      - name: api-deny
        run: bash scripts/ci/step.sh api-deny

      - name: api-build
        run: bash scripts/ci/step.sh api-build

      - name: api-test
        run: bash scripts/ci/step.sh api-test

      - name: Upload CI failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-api
          path: .ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: E2E (Playwright user harness)
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      YOHAKU_TABLE: yohaku-e2e
      DYNAMODB_PORT: "8000"
      PORT: "3848"
      VITE_API_URL: http://127.0.0.1:3848
      CI: true
      CI_SUMMARY_DIR: ${{ github.workspace }}/.ci
      DYNAMODB_LOG: ${{ github.workspace }}/.ci/dynamodb-server.log
      DYNAMODB_PID_FILE: ${{ github.workspace }}/.ci/dynamodb.pid
      API_LOG: ${{ github.workspace }}/.ci/api-server.log
      API_PID_FILE: ${{ github.workspace }}/.ci/api.pid
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: dynamodb
        run: bash scripts/ci/step.sh dynamodb

      - name: api-build
        run: bash scripts/ci/step.sh api-build

      - name: api-start
        run: bash scripts/ci/step.sh api-start

      - name: web-install
        run: bash scripts/ci/step.sh web-install

      - name: web-build
        run: bash scripts/ci/step.sh web-build

      - name: e2e-install
        run: bash scripts/ci/step.sh e2e-install

      - name: playwright-install
        run: bash scripts/ci/step.sh playwright-install

      - name: e2e
        run: bash scripts/ci/step.sh e2e

      - name: Upload CI failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-e2e
          path: .ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
