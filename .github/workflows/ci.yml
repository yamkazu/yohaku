name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  api:
    name: API (fmt + clippy + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      YOHAKU_TABLE: yohaku-ci
      DYNAMODB_PORT: "8000"
    steps:
      - uses: actions/checkout@v4

      # Match rust-toolchain.toml (1.94.1 + rustfmt/clippy); toolchain input is required
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Start DynamoDB Local
        working-directory: .
        run: |
          bash scripts/start-dynamodb.sh &
          echo $! > /tmp/dynamodb-local.pid
          for i in $(seq 1 60); do
            if (echo >/dev/tcp/127.0.0.1/${DYNAMODB_PORT}) >/dev/null 2>&1; then
              echo "DynamoDB Local ready on :${DYNAMODB_PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "DynamoDB Local failed to start"
          exit 1

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --features integration -- -D warnings

      - name: Build
        run: cargo build --locked --features integration

      - name: Test (unit + DynamoDB Local integration)
        run: cargo test --locked --features integration

  e2e:
    name: E2E (Playwright user harness)
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      YOHAKU_TABLE: yohaku-e2e
      DYNAMODB_PORT: "8000"
      PORT: "3848"
      VITE_API_URL: http://127.0.0.1:3848
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: Start DynamoDB Local
        run: |
          bash scripts/start-dynamodb.sh &
          echo $! > /tmp/dynamodb-local.pid
          for i in $(seq 1 60); do
            if (echo >/dev/tcp/127.0.0.1/${DYNAMODB_PORT}) >/dev/null 2>&1; then
              echo "DynamoDB Local ready on :${DYNAMODB_PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "DynamoDB Local failed to start"
          exit 1

      - name: Build API
        working-directory: api
        run: cargo build --locked

      - name: Start API
        run: |
          ./api/target/debug/yohaku-api &
          echo $! > /tmp/yohaku-api.pid
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${PORT}/health" >/dev/null; then
              echo "API ready on :${PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          exit 1

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run user harness (feed → article)
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
