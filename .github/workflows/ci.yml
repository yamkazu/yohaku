name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: bash scripts/ci/run.sh web-install

      - name: Lint
        run: bash scripts/ci/run.sh web-lint

      - name: Build
        run: bash scripts/ci/run.sh web-build

  api:
    name: API (fmt + clippy + build + test)
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      YOHAKU_TABLE: yohaku-ci
      DYNAMODB_PORT: "8000"
    steps:
      - uses: actions/checkout@v4

      # Match rust-toolchain.toml (1.94.1 + rustfmt/clippy); toolchain input is required
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Start DynamoDB Local
        run: bash scripts/ci/run.sh dynamodb

      - name: Format check
        run: bash scripts/ci/run.sh api-fmt

      - name: Clippy
        run: bash scripts/ci/run.sh api-clippy

      - name: Build
        run: bash scripts/ci/run.sh api-build

      - name: Test (unit + DynamoDB Local integration)
        run: bash scripts/ci/run.sh api-test

  e2e:
    name: E2E (Playwright user harness)
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      YOHAKU_TABLE: yohaku-e2e
      DYNAMODB_PORT: "8000"
      PORT: "3848"
      VITE_API_URL: http://127.0.0.1:3848
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: Start DynamoDB Local
        run: bash scripts/ci/run.sh dynamodb

      - name: Build API
        run: bash scripts/ci/run.sh api-build

      - name: Start API
        run: bash scripts/ci/run.sh api-start

      - name: Install web dependencies
        run: bash scripts/ci/run.sh web-install

      - name: Build web
        run: bash scripts/ci/run.sh web-build

      - name: Install e2e dependencies
        run: bash scripts/ci/run.sh e2e-install

      - name: Install Playwright Chromium
        run: bash scripts/ci/run.sh playwright-install

      - name: Run user harness (feed → article)
        run: bash scripts/ci/run.sh e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
