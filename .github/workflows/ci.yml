name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  api:
    name: API (fmt + clippy + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      YOHAKU_TABLE: yohaku-ci
      DYNAMODB_PORT: "8000"
    steps:
      - uses: actions/checkout@v4

      # Match rust-toolchain.toml (1.94.1 + rustfmt/clippy); toolchain input is required
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Start DynamoDB Local
        working-directory: .
        run: |
          bash scripts/start-dynamodb.sh &
          echo $! > /tmp/dynamodb-local.pid
          for i in $(seq 1 60); do
            if (echo >/dev/tcp/127.0.0.1/${DYNAMODB_PORT}) >/dev/null 2>&1; then
              echo "DynamoDB Local ready on :${DYNAMODB_PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "DynamoDB Local failed to start"
          exit 1

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --features integration -- -D warnings

      - name: Build
        run: cargo build --locked --features integration

      - name: Test (unit + DynamoDB Local integration)
        run: cargo test --locked --features integration
