name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-yohaku
  cancel-in-progress: false

jobs:
  deploy:
    name: cdk deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ap-northeast-1
      AWS_DEFAULT_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@v4

      - name: Require the GitHub OIDC role
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "${AWS_ROLE_ARN}" ]; then
            echo "Set the repository variable AWS_ROLE_ARN to the IAM role ARN." >&2
            echo "Do not store AWS access keys in the repository or in GitHub secrets." >&2
            exit 1
          fi

      - uses: ./.github/actions/build-cdk-assets

      - name: Synthesize
        run: npm run synth

      - name: Check template
        run: node scripts/check-cdk-template.mjs infra/cdk.out/Yohaku.template.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-session-name: yohaku-deploy

      # Bootstrap is once per account and region. Do not run it here.
      - name: Deploy
        run: npm --prefix infra run deploy
